apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paybridge-ingress
  namespace: paybridge-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.paybridge.io
      secretName: paybridge-tls-cert
  rules:
    - host: api.paybridge.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paybridge-backend-service
                port:
                  number: 8000
