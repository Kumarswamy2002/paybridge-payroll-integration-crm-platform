name: PayBridge CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Run FastAPI Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install email-validator python-jose[cryptography] passlib[bcrypt] aiosqlite pytest pytest-asyncio

      - name: Run Test Suite across All 10 Domains
        run: |
          cd backend
          python -m pytest --cov=app

  docker-build:
    name: Validate Docker Production Builds
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t paybridge-backend:latest ./backend
